<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Spotify Authorization</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));

      background:
        radial-gradient(circle at top left,
          #ff5f6d 0%,
          transparent 45%),
        radial-gradient(circle at bottom right,
          #6a5cff 0%,
          transparent 45%),
        linear-gradient(135deg, #ff9966, #8e54e9);

      color: #111;
    }

    .card {
      width: 100%;
      max-width: 420px;

      padding: 36px 28px 30px;

      text-align: center;

      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-radius: 28px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.20);
    }

    .icon {
      width: 72px;
      height: 72px;

      margin: 0 auto 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 22px;

      font-size: 34px;

      background: linear-gradient(135deg, #1db954, #1ed760);
      color: white;

      box-shadow:
        0 10px 25px rgba(29, 185, 84, 0.30);
    }

    h1 {
      margin: 0 0 12px;

      font-size: 27px;
      line-height: 1.2;
      font-weight: 700;
    }

    p {
      margin: 0 0 28px;

      font-size: 16px;
      line-height: 1.5;

      color: #555;
    }

    button {
      width: 100%;

      border: none;
      border-radius: 16px;

      padding: 17px 20px;

      font-size: 17px;
      font-weight: 600;

      color: white;

      background: linear-gradient(135deg, #1db954, #16a34a);

      box-shadow:
        0 8px 20px rgba(29, 185, 84, 0.30);

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 20px;

      font-size: 12px;
      color: #888;
    }

    @media (prefers-color-scheme: dark) {
      body {
        color: white;
      }

      .card {
        background: rgba(30, 30, 35, 0.90);
      }

      p {
        color: #bbb;
      }

      .footer {
        color: #777;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">
      ✓
    </div>

    <h1>Spotify Authorization Successful</h1>

    <p>
      Spotify has successfully authorized your account.
      Tap below to continue the Apple to Spotify shortcut.
    </p>

    <button id="continue">
      Continue
    </button>

    <div class="footer">
      Apple to Spotify
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");

    document.getElementById("continue").onclick = function () {

      if (!code) {
        alert("No Spotify authorization code was received.");
        return;
      }

      const shortcutURL =
        "shortcuts://run-shortcut" +
        "?name=Apple%20to%20Spotify" +
        "&input=text" +
        "&text=" + encodeURIComponent(code);

      window.location.href = shortcutURL;
    };
  </script>

</body>
</html>
